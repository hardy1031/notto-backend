info:
  name: quizzes
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/quizzes
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "notebooks": [
          {
            "id": "00000000-0000-0000-0000-000000000001",
            "name": "スラング",
            "created_at": "2026-04-01T12:00:00Z",
            "updated_at": "2026-04-01T12:00:00Z"
          }
        ],
        "notes": [
          {
            "id": "00000000-0000-0000-0000-000000000002",
            "notebook_id": "00000000-0000-0000-0000-000000000001",
            "content": "겠냐? マジでそうだと思うん？ むずいスラング",
            "created_at": "2026-04-01T12:00:00Z",
            "updated_at": "2026-04-01T12:00:00Z"
          }
        ]
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201 && res.body.generated && res.body.generated.length > 0) {
          const first = res.body.generated[0];
          bru.setEnvVar("context_object_id", first.context_object.id);
          if (first.quizzes && first.quizzes.length > 0) {
            bru.setEnvVar("quiz_id_1", first.quizzes[0].id);
          }
          if (first.quizzes && first.quizzes.length > 1) {
            bru.setEnvVar("quiz_id_2", first.quizzes[1].id);
          }
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
