info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "user_name": "{{test_user_name}}",
        "email": "{{test_email}}",
        "password": "{{test_password}}",
        "first_language": "{{test_first_language}}",
        "target_language": "{{test_target_language}}"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 201) {
          bru.setEnvVar("token", res.body.token);
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
