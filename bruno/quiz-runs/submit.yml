info:
  name: submit quiz run
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:3000/quiz-runs
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "started_at": "2026-04-01T12:00:00Z",
        "completed_at": "2026-04-01T12:05:00Z",
        "records": [
          {
            "quiz_id": "{{quiz_id_1}}",
            "user_answer": "겠냐?",
            "is_correct": true
          },
          {
            "quiz_id": "{{quiz_id_2}}",
            "user_answer": "casual",
            "is_correct": true
          }
        ]
      }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
