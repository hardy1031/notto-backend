  url: http://localhost:3000/sync/notebooks
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "notebooks": [
          {
            "id": "00000000-0000-0000-0000-000000000001",
            "name": "スラング",
            "created_at": "2026-04-01T12:00:00Z",
            "updated_at": "2026-04-01T12:00:00Z"
          }
        ],
        "notes": [
          {
            "id": "00000000-0000-0000-0000-000000000002",
            "notebook_id": "00000000-0000-0000-0000-000000000001",
            "name": "スラング",
      "content": "- 겠냐? :: rough dismissive question, like \"you really think so?\"\n- 나중에 :: see you later / catch you later",
            "created_at": "2026-04-01T12:00:00Z",
            "updated_at": "2026-04-01T12:00:00Z"
          }
        ]
