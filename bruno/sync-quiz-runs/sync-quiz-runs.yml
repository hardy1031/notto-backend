info:
  name: sync quiz runs
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/sync/quiz-runs"
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "quiz_runs": [
          {
            "id": "00000000-0000-0000-0000-000000000010",
            "started_at": "2026-04-01T12:00:00Z",
            "completed_at": "2026-04-01T12:05:00Z",
            "records": [
              {
                "id": "00000000-0000-0000-0000-000000000011",
                "quiz_id": "{{quiz_id_1}}",
                "choices": ["option1", "option2", "option3", "option4"],
                "user_answer": "겠냐?",
                "is_correct": true,
                "created_at": "2026-04-01T12:00:30Z"
              },
              {
                "id": "00000000-0000-0000-0000-000000000012",
                "quiz_id": "{{quiz_id_2}}",
                "choices": ["option1", "option2", "option3", "option4"],
                "user_answer": "casual",
                "is_correct": true,
                "created_at": "2026-04-01T12:01:00Z"
              }
            ]
          }
        ]
      }

tests:
  - name: status is 200
    assert: res.status == 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
