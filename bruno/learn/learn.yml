info:
  name: learn
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/learn"
  auth:
    type: bearer
    token: "{{token}}"
  body:
    type: json
    data: |-
      {
        "question": "How is 겠냐 different from 겠어?"
      }

tests:
  - name: status is 200
    assert: res.status == 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
