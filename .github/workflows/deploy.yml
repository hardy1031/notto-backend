name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target environment"
        required: true
        default: dev
        type: choice
        options:
          - dev
          - prod

jobs:
  deploy:
    name: Build & Deploy to Lambda
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # Required for OIDC
      contents: read

    steps:
      - name: Resolve environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "target=dev" >> $GITHUB_OUTPUT
          else
            echo "target=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          fi

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build (esbuild — TS → JS bundle)
        run: |
          bunx esbuild src/index.ts \
            --bundle \
            --platform=node \
            --target=node22 \
            --outfile=dist/index.js \
            --format=cjs \
            --minify \
            --external:@aws-sdk/client-s3

      - name: Package zip
        run: zip -j dist/function.zip dist/index.js

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::836651842524:role/GithubOIDC
          aws-region: us-west-2

      - name: Deploy to Lambda
        run: |
          FUNCTION_NAME="notto-backend-${{ steps.env.outputs.target }}"

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://dist/function.zip \
            --no-cli-pager

          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"
